services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seal_hackathon
      POSTGRES_USER: seal_admin
      POSTGRES_PASSWORD: seal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seal_admin -d seal_hackathon"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/seal_hackathon
      DB_USERNAME: seal_admin
      DB_PASSWORD: seal_password
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a root .env file first — see .env.example}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  bff:
    build: ./bff
    environment:
      PORT: 4001
      BACKEND_URL: http://backend:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NODE_ENV: production
    ports:
      - "4001:4001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BFF_URL: http://localhost:4001
    ports:
      - "3000:80"
    depends_on:
      bff:
        condition: service_healthy

volumes:
  postgres_data:
