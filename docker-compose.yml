services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seal_hackathon
      POSTGRES_USER: seal_admin
      POSTGRES_PASSWORD: seal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seal_admin -d seal_hackathon"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seal_hackathon
      DB_USERNAME: seal_admin
      DB_PASSWORD: seal_password
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  bff:
    build: ./bff
    environment:
      PORT: 4001
      BACKEND_URL: http://backend:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NODE_ENV: production
    ports:
      - "4001:4001"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BFF_URL: http://localhost:4001
    ports:
      - "3000:80"
    depends_on:
      - bff

volumes:
  postgres_data:
