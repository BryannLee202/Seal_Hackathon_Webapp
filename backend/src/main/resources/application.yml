spring:
  application:
    name: hackathon-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seal_hackathon}
    username: ${DB_USERNAME:seal_admin}
    password: ${DB_PASSWORD:seal_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktZm9yLXNlYWwtaGFja2F0aG9uLXN5c3RlbS0yMDI2}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.seal.hackathon: DEBUG
    org.springframework.security: INFO
